name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: .gitattributes and the hooks go out of their way to keep
        # the tool working there.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  design:
    # The rules in CLAUDE.md, held for every contributor and not only for
    # Claude Code sessions: the code keeps design/invariants.ofn, and a pull
    # request's code matches the plan it brings.
    name: Design checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build godesign
        run: go build -o "$RUNNER_TEMP/godesign" ./cmd/godesign
      - name: godesign invariants
        run: '"$RUNNER_TEMP/godesign" invariants -fail-on warning'
      - name: godesign conform
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base HEAD "origin/$BASE_REF")"
          "$RUNNER_TEMP/godesign" conform -base "$base" -fail-on warning

  plugin:
    # Claude Code updates an installed plugin only when its version goes up, so
    # a change under plugin/ has to raise it. The hook scripts must also parse.
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Hook scripts parse
        run: for f in plugin/hooks/*.sh; do bash -n "$f"; done
      - name: Manifests are JSON
        run: for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json plugin/hooks/hooks.json; do jq -e . "$f" >/dev/null; done
      - name: Plugin version went up
        if: github.event_name == 'pull_request'
        run: scripts/plugin-version-check.sh "origin/${{ github.base_ref }}"
